name: Fetch theme photos

# Wikimedia is unreachable from everywhere else in this setup, so the runner
# pulls the freely-licensed photos a themed week needs and commits them.

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Photo set (ducks, ryanday)"
        required: true
        default: "ducks"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Commons photos
        run: python scripts/fetch_photos.py --set "${{ inputs.set }}"

      - name: What landed
        run: |
          ls -la docs/assets/ducks docs/assets/day 2>/dev/null || true
          ls data/photo-credits*.json || true

      - name: Commit the photos
        run: |
          git config user.name "power-rankings-bot"
          git config user.email "actions@github.com"
          git add -A docs/assets data/photo-credits*.json || true
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Theme photos: ${{ inputs.set }}"
            git push
          fi
